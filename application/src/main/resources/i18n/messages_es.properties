##############################
########## TEXTOS WELCOME ##########
text.welcome=Abrimos embajada
text.welcome1=Abrir, implica descubrir o hacer patente lo que está cerrado u oculto, y eso es lo que hacemos. 
text.welcome2=Unión es lo que representa el escudo que nos acompaña. Y eso es lo que va a encontrar en la embajada.
text.welcome3=Llevamos a cabo esta tarea, a través de un cluster tecnológico, uniendo seres humanos y organizaciones, con lugares. Y es así, con tecnología de vanguardia, como vamos creando un medio que nos aporta valor.
text.welcome4=El servicio
text.welcome5=Satisface la necesidad de unirnos a modo de ejército, premisa necesaria para disfrutar, reflejando lo que somos capaces de hacer y donde nadie quede olvidado.

text.vision=Visión
text.vision1="Tierra y cielo unidos"
text.vision2=A través de un portal, el cual nos permite ver y disfrutar la vida en un entorno excelente, acompañados por nuestros seres queridos, en completa armonia.

text.mission=Misión
text.mission1="Unir caballeros blancos"
text.mission2=Quienes como seres humanos que tienen en su ascendencia un escudo de armas de origen europeo, tienen derecho a unirse.

text.values=Valores
text.values1=Vivimos con honestidad la heroicidad que se le confiere a todo aquel que hace lo que puede, y que con voluntad vence al miedo. Nuestro éxito está delante de lo que damos, pues solo quien ayuda con amor, recibe con lealtad.

########## TEXT THE EMBASSY ##########
text.theembassy=La Organización
text.theembassy1=Organizada según la jerarquía del ejército, está abierta a cualquier caballero blanco que quiera unirse.
text.theembassy2=Disfrutamos creando y nos gustaría contar contigo.
text.theembassy3=Debes saber que nos unimos como unidades militares, dependiendo de cada dominio, agrupándonos en unidades más grandes siempre en torno al administrador del lugar de llegada.
text.theembassy4=En la vida y en los negocios, la motivación se derrama en todo lo que hacemos y nos ayuda a elegir dónde enfocarnos.

########## TEXT JOIN ##########
text.humans=Seres humanos
text.humans1=Te ayudamos, pues es ayudando como trabajan las grandes organizaciones.
text.humans2=Es cierto que todos formamos una familia y que la gente vuelve a ser humana otra vez. Nosotros te ayudamos a que unas la tuya a través de la tecnología. Hacerlo es sencillo, te proveemos de las herramientas y de la ayuda que necesitas.
text.humans3=El viaje que vas a llevar a cabo con nosotros, te ofrece un sinfín de posibilidades que irás viendo a medida que transcurra el tiempo como miembro de nuestra misión.
text.humans4=Dar el primer paso, es comprender que el alcance es ilimitado y que lo iremos fijando unidos. 
text.humans5=Si te has decidido a darlo, y quieres ser un caballero blanco, adelante.

text.organizations=Organizaciones
text.organizations1=Representamos el negocio de los caballeros blancos.
text.organizations2=Llevamos a cabo esta misión, centrándonos sólo en las oportunidades y recordando que alcanzaremos nuestras expectativas.
text.organizations3=Las organizaciones estamos representadas en las embajadas por aquellos caballeros blancos a los que estamos unidas.
text.organizations4=Y como de unión se trata, apoyamos a todos aquellos seres humanos que buscan la unión de su familia, y con nosotras la encuentran.
text.organizations5=Llegamos de la mano de un caballero blanco, pues no existe otra posibilidad, puesto que sólo quien ostenta el poder, puede concederlo. Confiamos en organizaciones externas a nuestro cluster.

text.places=Lugares
text.places1=Siendo referencia geografica, somos la base en torno a la cual gira la vida en sus formas más variadas, por lo tanto la de seres humanos y organizaciones.
text.places2=Unimos mundo virtual y real, creando oportunidades de trabajo en todo el planeta a través de nuestros dominios, cuya administración es de caracter hereditario, en quien libremente determine el administrador.
text.places3=Somos puerta de entrada y salida, por lo tanto los primeros en ser creados y administrados proveyendote de espacio para ti y tu embajada.
text.places4=Perteneciendo a todos, es una prioridad crearnos a vuestra imagen y semejanza, donde demostreis todo el potencial de vuestra creatividad.
