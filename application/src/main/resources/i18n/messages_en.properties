########## TEXT WELCOME ##########
text.welcome=We open embassy
text.welcome1=Open, involves discovering or making clear what is closed or hidden, and that is what we do. 
text.welcome2=Union is what the coat or arms that accompanies us represents. And that's what you will find at the embassy.
text.welcome3=We make this task, through a technological cluster, joining human beings and organizations with places. And that is how, with cutting-edge technology, we are creating a medium that adds value to us.
text.welcome4=THE SERVICE
text.welcome5=Satisfies the need to join together like an army, a necessary premise to enjoy, reflecting what we are capable of doing and where nobody remain forgotten.

text.vision=Vision
text.vision1="Earth and sky joined"
text.vision2=Through a portal, which allows us to see and enjoy life in an excellent environment, accompanied by our loved ones, in complete harmony.

text.mission=Mission
text.mission1="Join white knights"
text.mission2=Those who as human beings who have in their ancestry a coat of arms of European origin, have the right to join.

text.values=Values
text.values1=Live with honesty the heroism that is conferred on everyone who does what he can, and who with will overcomes fear. Our success is ahead of what we give, because only of those who help with love, receive with loyalty.

########## TEXT THE EMBASSY ##########
text.theembassy=The Organization
text.theembassy1=Organized like the army, it is open to any white knight who wants to join us.
text.theembassy2=We enjoy creating and would like you to join us.
text.theembassy3=You should know that we join like military units, depending on each domain, grouping ourselves into larger units always around the administrator of the place of arrival.
text.theembassy4=In life and in business, motivation bleeds into everything we do and it helps us choose where to focus.

########## TEXT JOIN ##########
text.humans=Humans
text.humans1=We help you because it is by helping how large organizations work.
text.humans2=It is true that we all form a family and that people becoming humans again. We help you to join your family through technology. Doing so is simple, we provide you with the tools and help you need.
text.humans3=The travel that you are going to carry out with us offers you endless possibilities that you will see as time passes as a member of our mission.
text.humans4=Taking the first step is to understand that the scope is unlimited and that we will establish it together. 
text.humans5=If you have decided to give it, and want to be a white knight, go ahead.

text.organizations=Organizations
text.organizations1=We represent the business of the white knights.
text.organizations2=We do out this mission, focusing only on opportunities and remembering that we will meet our expectations.
text.organizations3=The organizations are represented in the embassies by those white knights with whom we are joined.
text.organizations4=And how the union is about, we support all those human beings who seek the union of their family, and with us they find it.
text.organizations5=We arrive from the hand of a white knight, because there is no other possibility, as only whoever holds power can grant it. We trust organizations outside our cluster too.

text.places=Places
text.places1=Being a geographical reference, we are the base around which life revolves in its most varied forms, therefore of human beings and organizations.
text.places2=We join the virtual and real-world, creating job opportunities in all the planet through our domains, whose administration is hereditary, in whom the administrator freely determines.
text.places3=We are the entry and exit gate, therefore the first to be created and managed, providing you with space for you and your embassy.
text.places4=Belonging to of all, it is a priority to create ourselves in your image and likeness, where you demonstrate the full potential of your creativity.
