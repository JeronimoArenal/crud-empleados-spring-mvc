# ===================================================================
# CONFIGURACION DEL SERVIDOR (Tomcat 11 / Jakarta EE 11)
# ===================================================================
server.port=8080
server.compression.enabled=true

# Estrategia de cabeceras proxy nativa (Sustituye por completo al obsoleto use-forward-headers)
server.forward-headers-strategy=native

# ===================================================================
# RENDIMIENTO MAXIMO (Java 25 Virtual Threads)
# ===================================================================
spring.threads.virtual.enabled=true

# ===================================================================
# RECURSOS ESTATICOS
# ===================================================================
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# ===================================================================
# POOL DE DATOS STANDARD: BASE DE DATOS PRINCIPAL (PostgreSQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://192.168.122.43:5432/crud_empleados_spring_mvc
spring.datasource.username=${DB_FE_USERNAME}
spring.datasource.password=${DB_FE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del Pool de Hikari estándar
spring.datasource.hikari.maximum-pool-size=30


# ===================================================================
# CONFIGURACION GLOBAL DE HIBERNATE / JPA
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# NOTA: Se elimina la propiedad explicita hibernate.dialect ya que Hibernate 6/7
# detecta automaticamente la version de PostgreSQL optimizando los tipos de Java 21.
