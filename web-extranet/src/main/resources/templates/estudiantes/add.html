```html
<div xmlns:th="http://www.thymeleaf.org" th:fragment="content">
    <div class="form-container">

        <div class="form-card">

            <!-- Encabezado Dinámico -->
            <div class="form-header">
                <h3>
                    <i th:class="${readonly} ? 'fa-solid fa-graduation-cap' : (${estudiante.id != null} ? 'fa-solid fa-user-pen' : 'fa-solid fa-user-plus')"></i>
                    <span th:text="${readonly} ? 'Perfil del Estudiante' : (${estudiante.id != null} ? 'Modificar Estudiante' : 'Nuevo Estudiante')">
                        Nuevo Estudiante
                    </span>
                </h3>
            </div>

            <!-- Cuerpo del Formulario -->
            <div class="form-body">

                <!-- Mensaje de Error -->
                <div th:if="${errorMensaje != null}" class="alert-error" role="alert">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span th:text="${errorMensaje}">Error</span>
                </div>

                <form th:action="@{/intranet/estudiantes/save}"
                      th:object="${estudiante}"
                      method="POST"
                      enctype="multipart/form-data">

                    <!-- Campo oculto para edición -->
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" name="imagenActual" th:value="*{image}" />

                    <!-- Nombre -->
                    <div class="form-group">
                        <label for="nombre" th:text="#{word.firstName}"></label>
                        <input type="text" id="nombre" th:field="*{nombre}" class="form-input" th:errorclass="is-invalid"
                               th:readonly="${readonly}" required>
                        <div th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error-feedback"> </div>
                    </div>

                    <!-- Apellidos -->
                    <div class="form-row">

                        <div class="form-group">
                            <label for="primerApellido" th:text="#{word.firstSurname}"></label>
                            <input type="text" id="primerApellido" th:field="*{primerApellido}"
                                   class="form-input" th:errorclass="is-invalid" th:readonly="${readonly}" required>
                            <div th:if="${#fields.hasErrors('primerApellido')}" th:errors="*{primerApellido}" class="error-feedback"> </div>
                        </div>

                        <div class="form-group">
                            <label for="segundoApellido"
                                   th:text="#{word.secondSurname}">
                            </label>
                            <input type="text" id="segundoApellido" th:field="*{segundoApellido}" class="form-input"
                                   th:errorclass="is-invalid" th:readonly="${readonly}">
                            <div th:if="${#fields.hasErrors('segundoApellido')}" th:errors="*{segundoApellido}" class="error-feedback"></div>
                        </div>
                    </div>

                    <!-- Género y Beca -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="genero">Género</label>
                            <select id="genero" th:field="*{genero}" class="form-select" th:disabled="${readonly}">
                                <option th:each="g : ${allGenders}"
                                        th:value="${g}"
                                        th:text="${g}">
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="beca">Beca Anual *</label>
                            <input type="number" step="0.01" id="beca" th:field="*{beca}" class="form-input"
                                   th:errorclass="is-invalid" th:readonly="${readonly}" required>
                            <div th:if="${#fields.hasErrors('beca')}" th:errors="*{beca}" class="error-feedback"></div>
                        </div>
                    </div>

                    <!-- Fecha Nacimiento y Asignaturas -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fechaNacimiento"> Fecha de Nacimiento * </label>
                            <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}" class="form-input"
                                   th:errorclass="is-invalid" th:readonly="${readonly}" required>
                            <div th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}" class="error-feedback"></div>
                        </div>

                        <div class="form-group">
                            <label for="totalAsignaturas">Total Asignaturas *</label>
                            <input type="number" id="totalAsignaturas" th:field="*{totalAsignaturas}" class="form-input"
                                   th:errorclass="is-invalid" th:readonly="${readonly}" required>
                            <div th:if="${#fields.hasErrors('totalAsignaturas')}" th:errors="*{totalAsignaturas}" class="error-feedback">
                            </div>
                        </div>

                    </div>

                    <!-- Facultad -->
                    <div class="form-group">
                        <label for="facultad">Facultad</label>
                        <select id="facultad" th:field="*{facultad}" class="form-select"
                                th:errorclass="is-invalid" th:disabled="${readonly}">
                            <option value="">
                                -- Seleccionar facultad --
                            </option>
                            <option th:each="fac : ${allFaculties}"
                                    th:value="${fac.id}"
                                    th:text="${fac.nombre}">
                            </option>
                        </select>
                        <div th:if="${#fields.hasErrors('facultad')}" th:errors="*{facultad}" class="error-feedback"></div>
                    </div>

                    <!-- Teléfonos -->
                    <div class="form-group">
                        <label for="telefono"><i class="fa-solid fa-phone"></i>Teléfonos
                        <small class="text-muted"> (Puede introducir varios separados por ;) </small></label>
                        <input type="text" id="telefono" name="strTelefono" th:value="${txtTelefono}" class="form-input"
                               th:readonly="${readonly}" placeholder="600123456; 611222333">
                    </div>

                    <!-- Correos -->
                    <div class="form-group">
                        <label for="correo"><i class="fa-solid fa-envelope"></i>Correos Electrónicos
                            <small class="text-muted"> (Puede introducir varios separados por ;) </small></label>
                        <input type="text" id="correo" name="strCorreo" th:value="${txtCorreo}" class="form-input"
                               th:readonly="${readonly}" placeholder="correo1@universidad.com; correo2@universidad.com">
                    </div>

                    <!-- SECCIÓN: FOTO DEL ESTUDIANTE -->
                    <div class="form-group">
                        <label for="imagenArchivo" th:text="#{word.image}"></label>

                        <!-- Input para subir archivo (Si no es solo lectura) -->
                        <input th:if="${readonly != true}" type="file" id="imagenArchivo" name="imagenArchivo" class="form-input-file">

                        <!-- Miniatura de foto actual -->
                        <div th:if="${estudiante.image != null and !estudiante.image.empty}" class="profile-image-container">
                            <img th:src="@{'/uploads/profiles/estudiante/' + ${estudiante.image}}" class="profile-image" alt="Foto actual">
                        </div>

                        <!-- Estado sin foto en modo lectura -->
                        <div th:if="${readonly == true and (estudiante.image == null or estudiante.image.empty)}" class="no-image-placeholder">
                            <i class="fa-solid fa-user-tie"></i>
                            <span>Sin foto de perfil</span>
                        </div>
                    </div>

                    <!-- Botones -->
                    <div class="form-actions">
                        <a th:href="@{/intranet/estudiantes}"
                           class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i>Volver
                        </a>

                        <button th:if="${readonly != true}" type="submit" class="btn btn-success">
                            <i class="fa-solid fa-floppy-disk"></i>Guardar
                        </button>

                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
