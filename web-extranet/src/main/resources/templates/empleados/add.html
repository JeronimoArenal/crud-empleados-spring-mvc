<div xmlns:th="http://www.thymeleaf.org" th:fragment="content">
    <div class="form-container">

        <div class="form-card">

            <!-- Encabezado Dinámico -->
            <div class="form-header">
                <h3>
                    <i th:class="${readonly} ? 'fa-solid fa-user' : (${empleado.id != null} ? 'fa-solid fa-user-pen' : 'fa-solid fa-user-plus')"></i>
                    <span th:text="${readonly} ? 'Perfil del Empleado' : (${empleado.id != null} ? 'Modificar Empleado' : 'Nuevo Empleado')">Nuevo Empleado</span>
                </h3>
            </div>
            <!-- Aqui tenemos solo 2 opciones Alta y Modificacion
            <div class="card-header bg-success text-white py-3">
                <h3 class="h5 mb-0 fw-bold">
                    <i th:class="${empleado.id != null} ? 'fa-solid fa-user-pen me-2' : 'fa-solid fa-user-plus me-2'"></i>
                    <span th:text="${empleado.id != null} ? 'Modificar Empleado' : 'Nuevo Empleado'">Nuevo Empleado</span>
                </h3>
            </div> -->

            <!-- Cuerpo del Formulario -->
            <div class="form-body">

                <!-- Mensaje de Error de base de datos -->
                <div th:if="${errorMensaje != null}" class="alert-error" role="alert">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span th:text="${errorMensaje}">Error</span>
                </div>

                <form th:action="@{/intranet/empleados/save}" th:object="${empleado}" method="POST" enctype="multipart/form-data">

                    <!-- CAMPOS OCULTOS -->
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" name="imagenActual" th:value="*{image}" />

                    <!-- Nombre completo -->
                    <div class="form-group">
                        <label for="nombre" th:text="#{word.firstName}"></label>
                        <input type="text" id="nombre" th:field="*{nombre}" class="form-input" th:errorclass="is-invalid" th:readonly="${readonly}" required>
                        <div th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error-feedback"></div>
                    </div>

                    <!-- Apellidos -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="primerApellido" th:text="#{word.firstSurname}"></label>
                            <input type="text" id="primerApellido" th:field="*{primerApellido}" class="form-input" th:errorclass="is-invalid" th:readonly="${readonly}" required>
                            <div th:if="${#fields.hasErrors('primerApellido')}" th:errors="*{primerApellido}" class="error-feedback"></div>
                        </div>

                        <div class="form-group">
                            <label for="segundoApellido" th:text="#{word.secondSurname}"></label>
                            <input type="text" id="segundoApellido" th:field="*{segundoApellido}" class="form-input" th:errorclass="is-invalid" th:readonly="${readonly}">
                            <div th:if="${#fields.hasErrors('segundoApellido')}" th:errors="*{segundoApellido}" class="error-feedback"></div>
                        </div>
                    </div>

                    <!-- Género y Salario -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="genero">Género</label>
                            <select id="genero" th:field="*{genero}" class="form-select" th:disabled="${readonly}">
                                <option th:each="g : ${allGenders}" th:value="${g}" th:text="${g}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="salario">Salario Anual *</label>
                            <input type="number" step="0.01" id="salario" th:field="*{salario}" class="form-input" th:readonly="${readonly}" required>
                        </div>
                    </div>

                    <!-- Fecha de Alta -->
                    <div class="form-group">
                        <label for="fechaAlta">Fecha de Alta *</label>
                        <input type="date" id="fechaAlta" th:field="*{fechaAlta}" class="form-input" th:readonly="${readonly}" required>
                    </div>

                    <!-- Selector de Departamentos -->
                    <div class="form-group">
                        <label for="departamento">Departamento</label>
                        <select id="departamento" th:field="*{departamento.id}" class="form-select" th:disabled="${readonly}">
                            <option value="">-- Seleccionar departamento --</option>
                            <option th:each="dept : ${allDepartments}" th:value="${dept.id}" th:text="${dept.nombre}"></option>
                        </select>
                        <div th:if="${#fields.hasErrors('departamento')}" th:errors="*{departamento}" class="error-feedback"></div>
                    </div>

                    <!-- Gestión teléfonos -->
                    <div class="form-group">
                        <label for="telefono"><i class="fa-solid fa-phone"></i>Teléfonos
                            <small class="text-muted"> (Puede introducir varios separados por ;) </small></label>
                        <input type="text" id="telefono" name="strTelefono" th:value="${txtTelefono}"
                                class="form-input" th:readonly="${readonly}" placeholder="600123456; 611222333; 622333444">
                    </div>

                    <!-- Gestion Correos -->
                    <div class="form-group">
                        <label for="correo"><i class="fa-solid fa-phone"></i>Correos electrónicos
                            <small class="text-muted"> (Puede introducir varios separados por ;) </small></label>
                        <input type="text" id="correo" name="strCorreo" th:value="${txtCorreo}"
                                class="form-input" th:readonly="${readonly}" placeholder="correo1@empresa.com; correo2@empresa.com">
                    </div>

                    <!-- SECCIÓN: FOTO DEL EMPLEADO -->
                    <div class="form-group">
                        <label for="imagenArchivo" th:text="#{word.image}"></label>

                        <!-- Input para subir archivo (Si no es solo lectura) -->
                        <input th:if="${readonly != true}" type="file" id="imagenArchivo" name="imagenArchivo" class="form-input-file">

                        <!-- Miniatura de foto actual -->
                        <div th:if="${empleado.image != null and !empleado.image.empty}" class="profile-image-container">
                            <img th:src="@{'/uploads/profiles/empleado/' + ${empleado.image}}" class="profile-image" alt="Foto actual">
                        </div>

                        <!-- Estado sin foto en modo lectura -->
                        <div th:if="${readonly == true and (empleado.image == null or empleado.image.empty)}" class="no-image-placeholder">
                            <i class="fa-solid fa-user-tie"></i>
                            <span>Sin foto de perfil</span>
                        </div>
                    </div>

                    <!-- BOTONES DE ACCIÓN -->
                    <div class="form-actions">
                        <a th:href="@{/intranet/empleados}" class="btn btn-secondary">
                            <i class="fa-solid fa-arrow-left"></i> Volver
                        </a>
                        <button th:if="${readonly != true}" type="submit" class="btn btn-success">
                            <i class="fa-solid fa-floppy-disk"></i> Guardar
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>
